<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#E8570A;
  --dark:#121009;
  --mid:#2A1F14;
  --card:#1C1510;
  --border:rgba(255,255,255,0.08);
  --text:#F0EBE4;
  --muted:rgba(240,235,228,0.45);
}
html{scroll-behavior:smooth}
body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}

/* HEADER */
.header{background:linear-gradient(180deg,#0D0A07 0%,var(--dark) 100%);padding:2rem 1.5rem 1.5rem;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
.header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.logo{font-family:'Bebas Neue',sans-serif;font-size:clamp(32px,5vw,56px);letter-spacing:2px;line-height:1}
.logo span{color:var(--orange)}
.header-sub{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.stats{display:flex;gap:20px}
.stat{text-align:center}
.stat-n{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--orange);line-height:1}
.stat-l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}

/* MAIN */
.main{max-width:1200px;margin:0 auto;padding:1.5rem}

/* FILTERS */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.5rem;align-items:center}
.day-tab{padding:7px 18px;border-radius:24px;border:1px solid var(--border);font-size:13px;font-weight:500;cursor:pointer;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;transition:all 0.2s;white-space:nowrap}
.day-tab:hover{border-color:var(--orange);color:var(--text)}
.day-tab.active{background:var(--orange);color:#fff;border-color:var(--orange)}

/* DAY SECTION */
.day-section{margin-bottom:2.5rem}
.day-header{display:flex;align-items:center;gap:12px;margin-bottom:1rem}
.day-badge{font-family:'Bebas Neue',sans-serif;font-size:14px;padding:5px 14px;border-radius:20px;letter-spacing:0.5px}
.d0{background:#3D2B1C}.d1{background:#5A3A22}.d2{background:#7A4E2D}.d3{background:var(--orange)}
.day-label{font-size:13px;color:var(--muted)}

/* SECTION DIVIDER */
.sec-div{display:flex;align-items:center;gap:12px;margin:1.25rem 0 0.875rem}
.sec-line{flex:1;height:1px;background:var(--border)}
.sec-label{font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:2px;color:var(--muted)}
.sec-label.el{color:var(--orange);opacity:0.8}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}

/* CARD */
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform 0.15s,border-color 0.15s,box-shadow 0.15s;position:relative;user-select:none}
.card:hover{transform:translateY(-2px);border-color:rgba(232,87,10,0.4);box-shadow:0 8px 24px rgba(0,0,0,0.4)}
.card.selected{border:2px solid var(--orange);box-shadow:0 0 20px rgba(232,87,10,0.25)}
.card.selected .check{opacity:1;transform:scale(1)}
.card-img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top center;display:block;background:var(--mid)}
.card-body{padding:8px 10px 10px}
.card-name{font-size:11px;font-weight:600;line-height:1.3;color:var(--text)}
.card-tag{font-size:9px;text-transform:uppercase;letter-spacing:0.5px;margin-top:3px;font-weight:500}
.card-tag.concert{color:#5BA3E8}
.card-tag.electronic{color:var(--orange)}
.check{position:absolute;top:7px;right:7px;width:22px;height:22px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(0.7);transition:opacity 0.15s,transform 0.2s}
.check svg{width:12px;height:12px}

/* FOOTER BAR */
.footer-bar{position:sticky;bottom:0;background:rgba(18,16,9,0.95);backdrop-filter:blur(16px);border-top:1px solid var(--border);padding:1rem 1.5rem}
.footer-inner{max-width:1200px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.export-btn{flex:1;min-width:200px;padding:14px 24px;background:var(--orange);color:#fff;border:none;border-radius:10px;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:background 0.15s,transform 0.1s}
.export-btn:hover{background:#CF4C09;transform:translateY(-1px)}
.export-btn:active{transform:translateY(0)}
.export-btn .badge{background:rgba(255,255,255,0.25);padding:3px 12px;border-radius:10px;font-size:16px;font-family:'DM Sans',sans-serif;font-weight:600}
.clear-btn{padding:12px 20px;background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:border-color 0.15s,color 0.15s;white-space:nowrap}
.clear-btn:hover{border-color:var(--orange);color:var(--text)}

/* TOAST */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:#2A1F14;border:1px solid var(--orange);color:var(--text);padding:10px 20px;border-radius:8px;font-size:13px;opacity:0;transition:opacity 0.2s,transform 0.2s;pointer-events:none;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

canvas{display:none}

@media(max-width:600px){
  .header-inner{flex-direction:column;align-items:flex-start}
  .stats{gap:16px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
  .footer-inner{flex-direction:column}
  .export-btn{width:100%}
  .clear-btn{width:100%;text-align:center}
}
</style>
</head>

document.getElementById('total-count').textContent=ACTS.length;

const sel=new Set();
let curDay='all';

// Auswahl aus localStorage laden
try{const s=localStorage.getItem('db26');if(s)JSON.parse(s).forEach(n=>sel.add(n));}catch(e){}

function save(){try{localStorage.setItem('db26',JSON.stringify([...sel]));}catch(e){}}

function mkCard(act){
  const d=document.createElement('div');
  d.className='card'+(sel.has(act.n)?' selected':'');
  d.id='c-'+act.n;
  const url=IMGS[act.k]||'';
  d.innerHTML=`
    <div class="check"><svg viewBox="0 0 12 12" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,6 5,9 10,3"/></svg></div>
    <img class="card-img" src="${url}" alt="${act.n}" loading="lazy" onerror="this.style.background='#2A1F14'">
    <div class="card-body">
      <div class="card-name">${act.n}</div>
      <div class="card-tag ${act.c}">${act.c==='electronic'?'Electronic Selection':'Konzert'}</div>
    </div>`;
  d.addEventListener('click',()=>{
    if(sel.has(act.n)){sel.delete(act.n);d.classList.remove('selected')}
    else{sel.add(act.n);d.classList.add('selected')}
    upd();save();
  });
  return d;
}

function mkDiv(label,el=false){
  const d=document.createElement('div');
  d.className='sec-div';
  d.innerHTML=`<div class="sec-line"></div><div class="sec-label${el?' el':''}">${label}</div><div class="sec-line"></div>`;
  return d;
}

function render(){
  const root=document.getElementById('root');
  root.innerHTML='';
  const days=curDay==='all'?['Do','Fr','Sa','So']:[curDay];
  days.forEach(day=>{
    const acts=ACTS.filter(a=>a.d===day);
    const concerts=acts.filter(a=>a.c==='concert');
    const elec=acts.filter(a=>a.c==='electronic');
    const sec=document.createElement('div');
    sec.className='day-section';
    sec.innerHTML=`<div class="day-header"><span class="day-badge ${DAY[day].c}">${day}</span><span class="day-label">${DAY[day].l}</span></div>`;
    if(concerts.length){
      sec.appendChild(mkDiv('Konzerte'));
      const g=document.createElement('div');g.className='grid';
      concerts.forEach(a=>g.appendChild(mkCard(a)));
      sec.appendChild(g);
    }
    if(elec.length){
      sec.appendChild(mkDiv('Electronic Selection',true));
      const g=document.createElement('div');g.className='grid';
      elec.forEach(a=>g.appendChild(mkCard(a)));
      sec.appendChild(g);
    }
    root.appendChild(sec);
  });
}

function upd(){
  document.getElementById('sel-count').textContent=sel.size;
  document.getElementById('exp-badge').textContent=sel.size;
}

function filterDay(day,btn){
  curDay=day;
  document.querySelectorAll('.day-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function clearAll(){
  sel.clear();save();
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('selected'));
  upd();
  showToast('Auswahl zurückgesetzt');
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function rr(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

function wrapText(ctx,text,x,y,maxW,lineH){
  const words=text.split(' ');let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxW&&line){ctx.fillText(line,x,y);line=w;y+=lineH}
    else line=t;
  }
  ctx.fillText(line,x,y);
}

function doExport(){
  const chosen=ACTS.filter(a=>sel.has(a.n));
  if(!chosen.length){showToast('Wähle zuerst mindestens einen Act aus!');return}
  const cols=4,CW=190,CH=255,GAP=10,PAD=24,HDR=118,FTR=44;
  const rows=Math.ceil(chosen.length/cols);
  const W=cols*CW+(cols-1)*GAP+PAD*2;
  const H=HDR+rows*(CH+GAP)+FTR;
  const cv=document.getElementById('cv');
  cv.width=W;cv.height=H;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#121009';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(232,87,10,0.13)';
  ctx.beginPath();ctx.arc(W-40,40,120,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#F0EBE4';
  ctx.font='bold 38px Arial Black,Arial';ctx.fillText('DEICHBRAND 2026',PAD,62);
  ctx.fillStyle='#E8570A';ctx.font='11px Arial';
  ctx.fillText('MEINE ACTS · 16.–19. JULI · CUXHAVEN/NORDHOLZ',PAD,82);
  ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fillRect(PAD,98,W-PAD*2,1);

  const jobs=chosen.map((act,i)=>new Promise(res=>{
    const row=Math.floor(i/cols),col=i%cols;
    const x=PAD+col*(CW+GAP),y=HDR+row*(CH+GAP);
    const imgH=CH-38;
    const draw=img=>{
      ctx.save();rr(ctx,x,y,CW,imgH,7);ctx.clip();
      if(img){ctx.drawImage(img,x,y,CW,imgH)}
      else{ctx.fillStyle='#2A1F14';ctx.fillRect(x,y,CW,imgH)}
      ctx.fillStyle='linear-gradient';
      const g=ctx.createLinearGradient(x,y+imgH*0.5,x,y+imgH);
      g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.65)');
      ctx.fillStyle=g;ctx.fillRect(x,y,CW,imgH);
      ctx.restore();
      ctx.fillStyle=act.c==='electronic'?'#E8570A':'rgba(255,255,255,0.55)';
      ctx.font='8px Arial';ctx.fillText(act.c==='electronic'?'ELECTRONIC':'KONZERT',x+8,y+imgH-28);
      ctx.fillStyle='#fff';ctx.font='bold 12px Arial';
      wrapText(ctx,act.n,x+8,y+imgH-14,CW-16,14);
      ctx.fillStyle='rgba(232,87,10,0.9)';
      rr(ctx,x,y+imgH,CW,38,0);ctx.fill();
      ctx.fillStyle='#fff';ctx.font='600 10px Arial';
      ctx.fillText(DAY[act.d].l,x+10,y+imgH+23);
      res();
    };
    const url=IMGS[act.k];
    if(!url){draw(null);return}
    const img=new Image();
    img.crossOrigin='anonymous';
    img.onload=()=>draw(img);
    img.onerror=()=>draw(null);
    img.src=url;
  }));

  Promise.all(jobs).then(()=>{
    ctx.fillStyle='rgba(255,255,255,0.18)';ctx.font='10px Arial';
    ctx.fillText('deichbrand.de',PAD,H-14);
    const a=document.createElement('a');
    a.href=cv.toDataURL('image/png');
    a.download='deichbrand2026_meine_acts.png';
    a.click();
    showToast('Bild gespeichert!');
  });
}

upd();
