.card-tag{font-size:10px;margin-top:2px}

.card-tag.electronic{color:var(--db-orange)}
.check{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;background:var(--db-orange);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.15s}
.check svg{width:11px;height:11px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.divider{display:flex;align-items:center;gap:10px;margin:1.25rem 0 0.75rem}

.clear-btn{display:block;margin:0.5rem auto 0;background:transparent;border:none;font-size:12px;color:var(--color-text-secondary);cursor:pointer;font-family:'DM Sans',sans-serif;text-decoration:underline}

document.getElementById('total-count').textContent=ACTS.length;

const sel=new Set();
let curDay='all';

function mkCard(act){
  const d=document.createElement('div');
  d.className='card';
  d.id='c-'+act.n;
  const img=IMGS[act.k]||'';
  d.innerHTML=`
    <div class="check"><svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg></div>
    <img class="card-img" src="${img}" alt="${act.n}" loading="lazy" onerror="this.style.background='#3D2E1E'">
    <div class="card-body">
      <div class="card-name">${act.n}</div>
      <div class="card-tag ${act.c}">${act.c==='electronic'?'Electronic':'Konzert'}</div>
    </div>`;
  d.addEventListener('click',()=>{
    if(sel.has(act.n)){sel.delete(act.n);d.classList.remove('selected')}
    else{sel.add(act.n);d.classList.add('selected')}
    upd();
  });
  return d;
}

function mkDivider(label){
  const d=document.createElement('div');
  d.className='divider';
  d.innerHTML=`<div class="divider-line"></div><div class="divider-label">${label}</div><div class="divider-line"></div>`;
  return d;
}

function render(){
  const root=document.getElementById('root');
  root.innerHTML='';
  const days=curDay==='all'?['Do','Fr','Sa','So']:[curDay];
  days.forEach(day=>{
    const acts=ACTS.filter(a=>a.d===day);
    const concerts=acts.filter(a=>a.c==='concert');
    const elec=acts.filter(a=>a.c==='electronic');
    const sec=document.createElement('div');
    sec.className='day-section';
    sec.innerHTML=`<div class="day-header"><span class="day-badge ${DAY_INFO[day].c}">${day}</span><span class="day-label">${DAY_INFO[day].l}</span></div>`;
    if(concerts.length){
      sec.appendChild(mkDivider('Konzerte'));
      const g=document.createElement('div');g.className='grid';
      concerts.forEach(a=>g.appendChild(mkCard(a)));
      sec.appendChild(g);
    }
    if(elec.length){
      sec.appendChild(mkDivider('Electronic Selection'));
      const g=document.createElement('div');g.className='grid';
      elec.forEach(a=>g.appendChild(mkCard(a)));
      sec.appendChild(g);
    }
    root.appendChild(sec);
  });
  sel.forEach(name=>{
    const el=document.getElementById('c-'+name);
    if(el)el.classList.add('selected');
  });
}

function upd(){
  document.getElementById('sel-count').textContent=sel.size;
  document.getElementById('exp-badge').textContent=sel.size;
}

function filterDay(day,btn){
  curDay=day;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function clearAll(){
  sel.clear();
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('selected'));
  upd();
}

function doExport(){
  const chosen=ACTS.filter(a=>sel.has(a.n));
  if(!chosen.length){alert('Wähle zuerst mindestens einen Act aus!');return}
  const cols=4,CARD_W=200,CARD_H=260,GAP=12,PAD=28,HEADER=120,FOOTER=50;
  const rows=Math.ceil(chosen.length/cols);
  const W=cols*CARD_W+(cols-1)*GAP+PAD*2;
  const H=HEADER+rows*(CARD_H+GAP)+FOOTER;
  const cv=document.getElementById('cv');
  cv.width=W;cv.height=H;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#1A1410';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(232,87,10,0.15)';
  ctx.beginPath();ctx.arc(W-50,50,130,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';
  ctx.font='bold 40px Arial Black, Arial';
  ctx.fillText('DEICHBRAND 2026',PAD,68);
  ctx.fillStyle='#E8570A';
  ctx.font='12px Arial';
  ctx.fillText('MEINE ACTS · 16.–19. JULI · CUXHAVEN/NORDHOLZ',PAD,90);
  ctx.fillStyle='rgba(255,255,255,0.12)';
  ctx.fillRect(PAD,105,W-PAD*2,1);

  const promises=chosen.map((act,i)=>{
    const row=Math.floor(i/cols),col=i%cols;
    const x=PAD+col*(CARD_W+GAP),y=HEADER+row*(CARD_H+GAP);
    return new Promise(res=>{
      const imgH=CARD_H-40;
      const draw=(imgEl)=>{
        ctx.save();
        rr(ctx,x,y,CARD_W,imgH,6);ctx.clip();
        if(imgEl){ctx.drawImage(imgEl,x,y,CARD_W,imgH)}
        else{ctx.fillStyle='#3D2E1E';ctx.fillRect(x,y,CARD_W,imgH)}
        ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(x,y,CARD_W,imgH);
        ctx.restore();
        ctx.fillStyle=act.c==='electronic'?'#E8570A':'rgba(255,255,255,0.6)';
        ctx.font='9px Arial';ctx.fillText(act.c==='electronic'?'ELECTRONIC':'KONZERT',x+8,y+imgH-32);
        ctx.fillStyle='#fff';ctx.font='bold 13px Arial';
        wrapText(ctx,act.n,x+8,y+imgH-18,CARD_W-16,15);
        ctx.fillStyle='rgba(232,87,10,0.85)';
        rr(ctx,x,y+imgH,CARD_W,40,0);ctx.fill();
        ctx.fillStyle='#fff';ctx.font='11px Arial';
        ctx.fillText(DAY_INFO[act.d].l.split(',')[0],x+10,y+imgH+25);
        res();
      };
      const url=IMGS[act.k];
      if(!url){draw(null);return}
      const img=new Image();
      img.crossOrigin='anonymous';
      img.onload=()=>draw(img);
      img.onerror=()=>draw(null);
      img.src=url;
    });
  });

  Promise.all(promises).then(()=>{
    ctx.fillStyle='rgba(255,255,255,0.2)';ctx.font='10px Arial';
    ctx.fillText('deichbrand.de',PAD,H-16);
    const a=document.createElement('a');
    a.href=cv.toDataURL('image/png');
    a.download='deichbrand2026_meine_acts.png';
    a.click();
  });
}

function rr(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

function wrapText(ctx,text,x,y,maxW,lineH){
  const words=text.split(' ');let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxW&&line){ctx.fillText(line,x,y);line=w;y+=lineH}
    else line=t;
  }
  ctx.fillText(line,x,y);
}

render();
